<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Definir palavra-passe — Núcleo Marques Bom</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#252129;background:#f7f5f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid #e5dfe8;border-radius:18px;padding:30px;box-shadow:0 12px 36px rgba(40,25,50,.08)}
    h1{margin:0 0 10px;color:#5b2a72;font-size:25px}
    p{line-height:1.55}
    label{display:block;margin-top:18px;font-weight:700}
    input{width:100%;margin-top:8px;padding:12px;border:1px solid #d7cedc;border-radius:10px;font-size:16px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#d2a51f;color:#17120a;font-weight:800;font-size:16px;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    .message{margin-top:16px;padding:12px;border-radius:10px}
    .error{background:#fff0f0;color:#9d2525}
    .success{background:#edf8f0;color:#216c3a}
    .hidden{display:none}
    .small{font-size:13px;color:#6d6570}
  </style>
</head>
<body>
  <main class="card">
    <h1>Definir palavra-passe</h1>
    <p>Bem-vindo à Área de Sócio do Núcleo Marques Bom.</p>
    <p>Escolhe agora a palavra-passe que vais utilizar para entrar na tua conta.</p>

    <form id="password-form" novalidate>
      <label for="password">Nova palavra-passe</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>

      <label for="password2">Confirmar palavra-passe</label>
      <input id="password2" type="password" minlength="8" autocomplete="new-password" required>

      <button id="submit-btn" type="submit">Guardar palavra-passe</button>
      <div id="message" class="message hidden" aria-live="polite"></div>
    </form>

    <p class="small">Depois de guardar, serás encaminhado para a Área de Sócio.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const SUPABASE_URL = "https://pvaupgdhtrmbumaxvvrj.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_8pqZLxvQA5kMbYYLD95WPg_0uFK5WRi";
      const APP_URL = new URL("socio-app.html", window.location.href).href;
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById("password-form");
      const password = document.getElementById("password");
      const password2 = document.getElementById("password2");
      const button = document.getElementById("submit-btn");
      const message = document.getElementById("message");

      function show(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      async function ensureSession() {
        const { data: { session }, error } = await client.auth.getSession();
        if (error) throw error;
        if (session) return session;

        const hash = window.location.hash.startsWith("#")
          ? window.location.hash.slice(1)
          : "";

        const params = new URLSearchParams(hash);
        const accessToken = params.get("access_token");
        const refreshToken = params.get("refresh_token");

        if (!accessToken || !refreshToken) {
          throw new Error("O convite é inválido, expirou ou já foi utilizado. Pede ao administrador um novo convite.");
        }

        const result = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (result.error) throw result.error;
        return result.data.session;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (password.value.length < 8)
          return show("A palavra-passe deve ter pelo menos 8 caracteres.", "error");

        if (password.value !== password2.value)
          return show("As palavras-passe não coincidem.", "error");

        try {
          button.disabled = true;
          button.textContent = "A guardar…";

          await ensureSession();

          const { error } = await client.auth.updateUser({
            password: password.value
          });

          if (error) throw error;

          show("Palavra-passe definida com sucesso. A entrar na Área de Sócio…", "success");

          window.history.replaceState({}, document.title, window.location.pathname);

          setTimeout(() => {
            window.location.href = APP_URL;
          }, 900);
        } catch (error) {
          console.error(error);
          show(error?.message || String(error), "error");
          button.disabled = false;
          button.textContent = "Guardar palavra-passe";
        }
      });
    })();
  </script>
</body>
</html>
